<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="26" fill="#ffffff"/>
  <!-- pignon / toiture -->
  <path d="M24 50 L60 22" fill="none" stroke="#2b2f33" stroke-width="7" stroke-linecap="round"/>
  <path d="M60 22 L96 50" fill="none" stroke="#b8662f" stroke-width="7" stroke-linecap="round"/>
  <!-- monogramme 2F -->
  <text x="58" y="86" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" fill="#2b2f33">2</text>
  <text x="60" y="86" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" fill="#b8662f">F</text>
  <!-- base en briques -->
  <g fill="#b6b0a6" stroke="#ffffff" stroke-width="1.6">
    <rect x="22" y="90" width="15" height="9" rx="1"/>
    <rect x="39" y="90" width="15" height="9" rx="1"/>
    <rect x="56" y="90" width="15" height="9" rx="1"/>
    <rect x="73" y="90" width="15" height="9" rx="1"/>
    <rect x="90" y="90" width="8" height="9" rx="1"/>
  </g>
  <!-- filet bicolore -->
  <line x1="22" y1="105" x2="60" y2="105" stroke="#2b2f33" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="105" x2="98" y2="105" stroke="#b8662f" stroke-width="3" stroke-linecap="round"/>
</svg>
