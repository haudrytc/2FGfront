# Blueprint Render — Front (site statique React/Vite)
services:
  - type: web
    name: 2fg-site
    runtime: static
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # ex: https://2fg-api.onrender.com
    routes:
      # SPA : toutes les routes renvoient vers index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
